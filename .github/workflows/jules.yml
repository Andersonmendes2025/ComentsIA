name: Jules Agent Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instrução / Tarefa para o Jules'
        required: true
        type: string

jobs:
  jules_review:
    name: Jules AI Agent Task
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Configure isolated test credentials
        run: |
          echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Run Test Suite
        env:
          OPENAI_API_KEY: sk-test-only-no-api-calls
        run: |
          python -m pytest
